[project]
name = "pizdocore"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "fastapi>=0.109.0",
    "httpx>=0.28.1",
    "pre-commit>=4.5.1",
    "pydantic>=2.5.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "python-multipart>=0.0.6",
    "sqlalchemy[asyncio]>=2.0.0",
    "uvicorn[standard]>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = [
    "integration: integration tests (pandoc+typst, real binaries)",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W"]  # E: pycodestyle, F: Pyflakes, W: warnings
ignore = ["E501"]  # line length handled by formatter

[dependency-groups]
dev = [
    "pdfplumber>=0.11.10",
]
